<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Room Planner | Pro Edition</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #007AFF;
            --surface: rgba(15, 15, 15, 0.96);
            --text-main: #FFFFFF;
            --text-dim: #888888;
        }

        body { 
            margin: 0; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; 
            color: var(--text-main); overflow: hidden; 
        }

        model-viewer {
            width: 100vw; height: 100vh;
            background-color: #111;
            --poster-color: transparent;
        }

        /* Top Bar */
        .header {
            position: absolute; top: 0; width: 100%; padding: 25px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10; box-sizing: border-box;
        }
        .brand { font-weight: 900; letter-spacing: 1px; font-size: 1.1rem; text-transform: uppercase; }
        .brand span { color: var(--primary); }

        #ar-button {
            background: var(--primary);
            color: white; border: none; padding: 12px 22px;
            border-radius: 50px; font-weight: 700; font-size: 0.85rem;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }

        /* Bottom Menu */
        .drawer {
            position: absolute; bottom: 20px; left: 12px; right: 12px;
            background: var(--surface);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; z-index: 100;
        }

        .section-header { font-size: 0.65rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }

        .theme-carousel { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; }
        .theme-carousel::-webkit-scrollbar { display: none; }

        .theme-pill {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 10px 20px; border-radius: 50px; 
            white-space: nowrap; font-size: 0.8rem; font-weight: 600;
        }
        .theme-pill.active { background: white; color: black; }

        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        
        .action-item {
            background: transparent; border: none; color: var(--text-dim);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .action-item i { 
            width: 52px; height: 52px; background: rgba(255,255,255,0.05); 
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; transition: 0.3s;
        }
        .action-item.active { color: var(--primary); }
        .action-item.active i { background: var(--primary); color: white; transform: translateY(-3px); }
        .action-item span { font-size: 0.55rem; font-weight: 800; }
    </style>
</head>
<body>

    <header class="header">
        <div class="brand">AR <span>ROOM PLANNER</span></div>
        <button id="ar-button" slot="ar-button">
            <i class="fa-solid fa-cube"></i> START AR
        </button>
    </header>

    <!-- 
        Fungsi Move, Rotate, Resize diaktifkan melalui:
        1. ar-scale="auto" (Cubit untuk Resize)
        2. camera-controls (Satu jari untuk Rotate/Move)
    -->
    <model-viewer id="main-view"
        src="modern_desk.glb" 
        ar
        ar-modes="scene-viewer webxr quick-look"
        ar-placement="floor"
        ar-scale="auto"
        camera-controls
        interaction-prompt="auto"
        shadow-intensity="2"
        exposure="1.2">

        <div class="drawer">
            <div class="section-header">1. Style Theme</div>
            <div class="theme-carousel">
                <button id="t-modern" class="theme-pill active" onclick="setTheme('modern')">Modern</button>
                <button id="t-wizard" class="theme-pill" onclick="setTheme('wizard')">Wizard</button>
                <button id="t-younger" class="theme-pill" onclick="setTheme('younger')">Younger</button>
                <button id="t-gaming" class="theme-pill" onclick="setTheme('gaming')">Gaming</button>
            </div>

            <div class="section-header">2. Furniture Selection</div>
            <div class="action-grid">
                <button id="i-desk" class="action-item active" onclick="setItem('desk')">
                    <i class="fa-solid fa-desktop"></i>
                    <span>DESK</span>
                </button>
                <button id="i-bed" class="action-item" onclick="setItem('bed')">
                    <i class="fa-solid fa-bed"></i>
                    <span>BED</span>
                </button>
                <button id="i-chair" class="action-item" onclick="setItem('chair')">
                    <i class="fa-solid fa-chair"></i>
                    <span>CHAIR</span>
                </button>
                <button id="i-wardrobe" class="action-item" onclick="setItem('wardrobe')">
                    <i class="fa-solid fa-door-closed"></i>
                    <span>WARDROBE</span>
                </button>
            </div>
        </div>
    </model-viewer>

    <script>
        const viewer = document.getElementById('main-view');
        let currentTheme = 'modern';
        let currentItem = 'desk';

        function setTheme(t) {
            currentTheme = t;
            document.querySelectorAll('.theme-pill').forEach(b => b.classList.remove('active'));
            document.getElementById('t-' + t).classList.add('active');
            updateModel();
        }

        function setItem(i) {
            currentItem = i;
            document.querySelectorAll('.action-item').forEach(b => b.classList.remove('active'));
            document.getElementById('i-' + i).classList.add('active');
            updateModel();
        }

        function updateModel() {
            // Membina nama fail: tema_perabot.glb
            const target = currentTheme + "_" + currentItem + ".glb";
            viewer.src = target;
            console.log("Loading: " + target);
        }
    </script>
</body>
</html>
