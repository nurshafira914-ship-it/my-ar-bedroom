<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Room Planner | Pro Edition</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #007AFF;
            --surface: rgba(15, 15, 15, 0.98);
            --text-main: #FFFFFF;
            --text-dim: #888888;
        }

        body { 
            margin: 0; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; 
            color: var(--text-main); overflow: hidden; 
        }

        model-viewer {
            width: 100vw; height: 100vh;
            background-color: #111;
            --poster-color: transparent;
        }

        .header {
            position: absolute; top: 0; width: 100%; padding: 25px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10; box-sizing: border-box;
        }
        .brand { font-weight: 900; letter-spacing: 1px; font-size: 1.1rem; text-transform: uppercase; }
        .brand span { color: var(--primary); }

        #ar-button {
            background: var(--primary); color: white; border: none; padding: 12px 22px;
            border-radius: 50px; font-weight: 700; display: flex; align-items: center; gap: 10px;
        }

        .drawer {
            position: absolute; bottom: 20px; left: 12px; right: 12px;
            background: var(--surface); backdrop-filter: blur(40px);
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            padding: 24px; z-index: 100;
        }

        .section-header { font-size: 0.65rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }

        .theme-carousel { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin-bottom: 25px; }
        .theme-pill {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 10px 20px; border-radius: 50px; 
            white-space: nowrap; font-size: 0.85rem; font-weight: 600;
        }
        .theme-pill.active { background: white; color: black; }

        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .action-item {
            background: transparent; border: none; color: var(--text-dim);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .action-item i { 
            width: 55px; height: 55px; background: rgba(255,255,255,0.05); 
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; transition: 0.3s;
        }
        .action-item.active { color: var(--primary); }
        .action-item.active i { background: var(--primary); color: white; transform: translateY(-5px); }
        .action-item span { font-size: 0.6rem; font-weight: 800; }
    </style>
</head>
<body>

    <header class="header">
        <div class="brand">AR <span>ROOM PLANNER</span></div>
        <button id="ar-button" slot="ar-button">
            <i class="fa-solid fa-expand"></i> START AR
        </button>
    </header>

    <model-viewer id="planner"
        src="modern_desk.glb" 
        ar ar-modes="scene-viewer webxr quick-look" 
        ar-placement="floor" 
        ar-scale="auto"
        camera-controls 
        touch-action="pan-y" 
        shadow-intensity="2" 
        exposure="1.2">

        <div class="drawer">
            <div class="section-header">1. Select Style</div>
            <div class="theme-carousel">
                <button id="btn-modern" class="theme-pill active" onclick="updateTheme('modern')">Modern</button>
                <button id="btn-wizard" class="theme-pill" onclick="updateTheme('wizard')">Wizard</button>
                <button id="btn-younger" class="theme-pill" onclick="updateTheme('younger')">Younger</button>
                <button id="btn-gaming" class="theme-pill" onclick="updateTheme('gaming')">Gaming</button>
            </div>

            <div class="section-header">2. Select Furniture</div>
            <div class="action-grid">
                <button id="btn-desk" class="action-item active" onclick="updateItem('desk')">
                    <i class="fa-solid fa-desktop"></i><span>DESK</span>
                </button>
                <button id="btn-bed" class="action-item" onclick="updateItem('bed')">
                    <i class="fa-solid fa-bed"></i><span>BED</span>
                </button>
                <button id="btn-chair" class="action-item" onclick="updateItem('chair')">
                    <i class="fa-solid fa-chair"></i><span>CHAIR</span>
                </button>
                <button id="btn-wardrobe" class="action-item" onclick="updateItem('wardrobe')">
                    <i class="fa-solid fa-door-closed"></i><span>WARDROBE</span>
                </button>
            </div>
        </div>
    </model-viewer>

    <script>
        const viewer = document.getElementById('planner');
        let currentTheme = 'modern';
        let currentItem = 'desk';

        const modelMap = {
            modern: { desk: "modern_desk.glb", bed: "modern_bed.glb", chair: "modern_chair.glb", wardrobe: "modern_wardrobe.glb" },
            wizard: { desk: "wizard_desk.glb", bed: "wizard_bed.glb", chair: "wizard_chair.glb", wardrobe: "wizard_wardrobe.glb" },
            younger: { desk: "younger_desk.glb", bed: "younger_bed.glb", chair: "younger_chair.glb", wardrobe: "younger_wardrobe.glb" },
            gaming: { desk: "gaming_desk.glb", bed: "gaming_bed.glb", chair: "gaming_chair.glb", wardrobe: "gaming_wardrobe.glb" }
        };

        function updateTheme(t) {
            currentTheme = t;
            document.querySelectorAll('.theme-pill').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + t).classList.add('active');
            render();
        }

        function updateItem(i) {
            currentItem = i;
            document.querySelectorAll('.action-item').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + i).classList.add('active');
            render();
        }

        function render() {
            const targetFile = modelMap[currentTheme][currentItem];
            
            // Log untuk kita semak fail mana yang sedang dipanggil
            console.log("Pilihan Semasa:", currentTheme, currentItem);
            console.log("Memuatkan Fail:", targetFile);

            // CARA PALING AGRESIF UNTUK TUKAR SRC
            // Kita reset src dulu sekejap sebelum masukkan yang baru
            viewer.src = ""; 
            setTimeout(() => {
                viewer.setAttribute('src', targetFile);
            }, 50);
        }
    </script>
</body>
</html>
