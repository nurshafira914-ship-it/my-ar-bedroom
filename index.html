<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Theme Bedroom Designer</title>
    <!-- Using the latest 2026 Model Viewer stable release -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #121212; color: white; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* Top Theme Bar */
        .theme-bar { 
            display: flex; gap: 10px; overflow-x: auto; padding: 15px; 
            background: #1e1e1e; border-bottom: 1px solid #333; scrollbar-width: none;
        }
        .theme-btn { 
            padding: 10px 20px; border-radius: 20px; border: 1px solid #444; 
            background: transparent; color: white; white-space: nowrap; cursor: pointer;
        }
        .theme-btn.active { background: #007bff; border-color: #007bff; box-shadow: 0 0 10px rgba(0,123,255,0.5); }

        /* AR View Area */
        model-viewer { flex-grow: 1; width: 100%; background: #000; --poster-color: transparent; }

        /* Bottom Furniture Bar */
        .furniture-bar { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; background: rgba(0,0,0,0.85); 
            padding: 15px 25px; border-radius: 50px; backdrop-filter: blur(10px);
        }
        .item-btn { 
            padding: 10px 15px; border-radius: 12px; border: none; 
            background: #333; color: white; font-size: 0.75rem; font-weight: bold;
        }
        .item-btn.active { background: #fff; color: #000; }

        #ar-prompt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Theme Selection (Modern, Wizard, Youngers, Gaming) -->
    <div class="theme-bar">
        <button class="theme-btn active" onclick="setTheme('modern', this)">✨ Modern</button>
        <button class="theme-btn" onclick="setTheme('wizard', this)">🪄 Wizard</button>
        <button class="theme-btn" onclick="setTheme('younger', this)">🛹 Younger</button>
        <button class="theme-btn" onclick="setTheme('gaming', this)">🎮 Gaming</button>
    </div>

    <!-- 2. The Main Viewer -->
    <!-- Prioritizing scene-viewer for Xiaomi stability -->
    <model-viewer id="main-view" 
        src="modern_desk.glb" 
        ar 
        ar-modes="scene-viewer webxr quick-look" 
        camera-controls 
        ar-placement="floor" 
        shadow-intensity="1" 
        environment-image="neutral"
        touch-action="pan-y">
        
        <div id="ar-prompt">Loading 3D Scene...</div>

        <!-- 3. Furniture Selection (Desk, Chair, Bed, Wardrobe) -->
        <div class="furniture-bar" slot="footer">
            <button class="item-btn active" id="btn-desk" onclick="setItem('desk')">DESK</button>
            <button class="item-btn" id="btn-chair" onclick="setItem('chair')">CHAIR</button>
            <button class="item-btn" id="btn-bed" onclick="setItem('bed')">BED</button>
            <button class="item-btn" id="btn-wardrobe" onclick="setItem('wardrobe')">WARDROBE</button>
        </div>
    </model-viewer>
</div>

<script>
    let currentTheme = 'modern';
    let currentItem = 'desk';
    const viewer = document.querySelector('#main-view');

    function setTheme(theme, btn) {
        currentTheme = theme;
        // Update Theme UI
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateModel();
    }

    function setItem(item) {
        currentItem = item;
        // Update Item UI
        document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + item).classList.add('active');
        updateModel();
    }

    function updateModel() {
        const fileName = `${currentTheme}_${currentItem}.glb`;
        viewer.src = fileName;
        console.log("Loading model: " + fileName);
    }
</script>

</body>
</html>
